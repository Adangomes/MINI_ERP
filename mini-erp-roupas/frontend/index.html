<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mini ERP - Login</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="card login-box">
        <h2>Mini ERP Moda</h2>
        <p style="margin-bottom: 15px; color: #64748b;">Acesse o sistema com as credenciais</p>
        <form id="formLogin">
            <input type="text" id="usuario" placeholder="Usuário (admin)" value="admin" required style="margin-bottom: 10px;">
            <input type="password" id="senha" placeholder="Senha" value="M1n1ERP@" required style="margin-bottom: 15px;">
            <button type="submit">Entrar no Sistema</button>
        </form>
        <div style="margin-top: 18px;">
            <a href="produtos.html" style="color: #2563eb; text-decoration: none;">Abrir módulos sem login</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            try {
                const res = await apiRequest('/login', 'POST', {
                    usuario: document.getElementById('usuario').value,
                    senha: document.getElementById('senha').value
                });
                if (res.sucesso && res.dados && res.dados.token) {
                    localStorage.setItem('token', res.dados.token);
                    localStorage.setItem('usuario', document.getElementById('usuario').value);
                    window.location.href = 'produtos.html';
                }
            } catch (err) {
                console.error('Falha ao entrar no sistema:', err);
            }
        });
    </script>
</body>
</html>
